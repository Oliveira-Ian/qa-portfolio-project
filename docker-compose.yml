services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oliveira_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oliveira_erp
      PORT: 3000
      # Passed through from the host shell if set (`ADMIN_EMAIL=... docker
      # compose up`) so the entrypoint's `db:seed` step can bootstrap an
      # admin. Left unset otherwise — seeding the permission catalog and
      # default profiles doesn't require them.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # apps/api's env.ts refuses to boot with NODE_ENV=production (set by
      # apps/api/Dockerfile) unless a real secret is provided — this
      # container-only default satisfies that for `docker compose up`
      # locally/in CI. It is not a production secret: override with a real
      # `JWT_SECRET` in the host shell before deploying this compose file
      # anywhere it needs to be trusted.
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-not-a-real-secret}
      # Where telemetry is pushed. No `depends_on: lgtm` on purpose: the
      # observability container is optional (profile below), and with nothing
      # listening the exporters drop their data quietly — the API runs the same.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # In-network service name — the API is called from the Next server
      # (inside this container), not from the browser, so this doesn't need
      # to be host-reachable the way a NEXT_PUBLIC_* value would.
      API_URL: http://api:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    ports:
      - '3000:3000'
    depends_on:
      - api

  # Local observability backend: OpenTelemetry Collector, Loki (logs), Tempo
  # (traces), Prometheus (metrics) and Grafana in one image. Development and
  # testing only — see docs/operations/observability.md and ADR 0017.
  #
  # Behind a profile so `docker compose up` (and the CI smoke test) neither
  # pulls nor starts it. Start it with `npm run obs:up`.
  #
  # Published on 127.0.0.1 only: no authentication is configured, so it must not
  # be reachable from the network. Grafana is on 3002 because 3000 is the web app.
  # Loki, Tempo and Prometheus are not published at all; Grafana reaches them
  # inside the container.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: [observability]
    ports:
      - '127.0.0.1:3002:3000' # Grafana
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP — what the API and the web app push to
    volumes:
      - lgtm-data:/data
      # The image already provisions the datasources (Prometheus, Tempo, Loki)
      # with the links between them; these add the dashboard and the alerts.
      - ./infra/observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/oliveira.yaml:ro
      - ./infra/observability/grafana/dashboards:/oliveira/dashboards:ro
      - ./infra/observability/grafana/alerting.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/oliveira.yaml:ro

volumes:
  postgres-data:
  lgtm-data:
