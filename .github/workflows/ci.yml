name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build shared schemas package
        run: npm run build -w packages/schemas

      - name: Build apps/web
        run: npm run build -w apps/web

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  api-tests:
    name: API Tests (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oliveira_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oliveira_erp?schema=public
      PORT: 3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Build shared schemas package
        run: npm run build -w packages/schemas

      - name: Run API tests
        run: npm run test:api

  e2e-tests:
    name: E2E Tests (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oliveira_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oliveira_erp?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Build shared schemas package
        run: npm run build -w packages/schemas

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (auth, dashboard, people, accessibility)
        run: npx playwright test --config=tests/e2e/playwright.config.ts

  docker-build:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for services to respond
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
          timeout 60 sh -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
