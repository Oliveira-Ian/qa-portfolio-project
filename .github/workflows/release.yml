name: Release

# Runs on every push to main, but only does something when release-please decides a
# release is due:
#   1. release-please keeps a release PR up to date from the Conventional Commits on
#      main. Merging that PR is what creates the vX.Y.Z tag, the GitHub Release and
#      CHANGELOG.md — nothing is released by a plain merge.
#   2. Only when a Release was just created, the web and api images are built, scanned
#      and pushed to Docker Hub.
#   3. Only then, a PR syncing main back into develop is opened.
# See docs/process/versioning.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A personal access token, not GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN do not trigger other workflows, so the release PR would never
      # get its required CI checks. The token is a fine-grained PAT scoped to this
      # repository (Contents, Pull requests and Issues: read and write).
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish ${{ matrix.app }} image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: api
            dockerfile: apps/api/Dockerfile
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/oliveira-foundation-${{ matrix.app }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check Docker Hub configuration
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME is not set."
            exit 1
          fi

      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A published version is never overwritten: if <image>:<version> already exists
      # the job stops. A missing tag (or a repository that does not exist yet) is the
      # expected case; any other failure is treated as "cannot verify" and also stops.
      - name: Refuse to overwrite a published version
        run: |
          if output=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION is already published. Published versions are immutable."
            exit 1
          fi
          if echo "$output" | grep -qiE 'not found|manifest unknown|no such manifest|does not exist|denied'; then
            echo "$IMAGE:$VERSION is not published yet."
          else
            echo "::error::Could not verify whether $IMAGE:$VERSION exists: $output"
            exit 1
          fi

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}},value=${{ env.TAG_NAME }},enable=${{ !startsWith(env.TAG_NAME, 'v0.') }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
          labels: |
            org.opencontainers.image.title=oliveira-foundation-${{ matrix.app }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Report-only, like docker-dev.yml: the findings land in the Security tab, they
      # do not stop a release. A scan that cannot run still fails the job.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-release-${{ matrix.app }}.sarif
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release-${{ matrix.app }}.sarif
          category: trivy-release-${{ matrix.app }}

      # Same inputs as the build above, so every layer comes from the cache.
      - name: Push ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}

  sync-develop:
    name: Sync main into develop
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # The release commit (version bump + CHANGELOG.md) exists only on main. This PR
      # brings it back so the next develop -> main promotion does not replay it.
      - name: Open the sync PR
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/develop...main" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "develop already contains main; nothing to sync."
            exit 0
          fi
          existing=$(gh pr list --base develop --head main --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A sync PR is already open."
            exit 0
          fi
          gh pr create --base develop --head main \
            --title "chore: sync main into develop after $TAG_NAME" \
            --body "Brings the $TAG_NAME release commit (version bump and CHANGELOG.md) back into develop.

          **Merge this with a merge commit. Do not squash it**: a squash would create a commit that does not exist on main and the two branches would drift apart again."
